title: "Sean Normoyle"
author: "Sean Normoyle"
tagline: "Software engineer and Salesforce architect."
description: "Sean Normoyle is a software engineer and Salesforce architect. Salesforce certifications, talks, browser games, and tools."
url: "https://seannormoyle.net"
lang: "en"
permalink: /:title/

# Projects live in _games/ and _tools/, one Markdown file each.
collections:
  games:
    output: true
    permalink: /games/:name/
  tools:
    output: true
    permalink: /tools/:name/

defaults:
  - scope: { path: "", type: games }
    values: { layout: project, section: Games }
  - scope: { path: "", type: tools }
    values: { layout: project, section: Tools }
  - scope: { path: "games/stackmo/play/game_debug.html" }
    values: { sitemap: false }

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap

exclude:
  - NOTES.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - .gemini
  - vendor
