<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body class="{{ page.body_class }}">
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/#projects' | relative_url }}"{% if page.collection == 'games' or page.collection == 'tools' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>

<main id="main" class="wrap">
{{ content }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>{{ site.author }}</span>
    {% include social-links.html %}
  </div>
</footer>
</body>
</html>
